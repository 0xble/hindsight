name: Repository gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # Mergify opens each merge-queue batch as a draft PR from a
    # mergify/merge-queue/ branch. The batch head is the exact commit main
    # fast-forwards to, so it must run the complete gate. Other drafts stay
    # skipped and fail qualification.
    if: >-
      ${{ !github.event.pull_request.draft ||
      (github.event.pull_request.user.login == 'mergify[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Run exact-SHA gate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_ACTIONS: true
        run: ./bin/ci gate "$EXPECTED_SHA"

  qualification:
    name: qualification
    needs: [gate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require gate success
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          DRAFT_PR: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          if [ "$GATE_RESULT" = success ]; then
            exit 0
          fi
          if [ "$DRAFT_PR" = "true" ] && [ "$GATE_RESULT" = skipped ]; then
            echo 'draft: gate not run' >&2
          else
            echo 'gate not qualified' >&2
          fi
          exit 1
