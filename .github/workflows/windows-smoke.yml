name: Manual Windows Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-core-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install locked development dependencies
        working-directory: hindsight-api-slim
        run: uv sync --frozen --group dev
      - name: Run OCR regression
        working-directory: hindsight-api-slim
        run: uv run --frozen pytest tests/test_ocr_quality.py
      - name: Compile and import API
        working-directory: hindsight-api-slim
        run: |
          uv run --frozen python -m compileall -q hindsight_api
          uv run --frozen python -c "import hindsight_api, hindsight_api.config, hindsight_api.main"
