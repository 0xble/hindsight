name: Manual Performance Smoke

on:
  workflow_dispatch:
    inputs:
      scale:
        description: Test scale
        type: choice
        options: [tiny, small]
        default: tiny
      suite:
        description: Optional performance suite
        type: choice
        options: [all, retain, recall, consolidation]
        default: all

permissions:
  contents: read

concurrency:
  group: manual-performance-smoke
  cancel-in-progress: true

jobs:
  performance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Run mock-LLM performance smoke
        env:
          SCALE: ${{ inputs.scale }}
          SUITE: ${{ inputs.suite }}
        run: |
          args=(--scale "$SCALE" --output perf-results.json)
          if [ "$SUITE" != all ]; then args+=(--suite "$SUITE"); fi
          ./scripts/benchmarks/run-perf-test.sh "${args[@]}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fork-performance-${{ github.sha }}
          path: hindsight-dev/perf-results.json
          retention-days: 14
          if-no-files-found: error
