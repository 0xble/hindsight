name: Fork Workflow Policy

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted policy
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Checkout immutable candidate
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Set up trusted Python
        uses: actions/setup-python@v6
        with:
          python-version-file: trusted/.python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Test trusted policy validator
        run: uv run --directory trusted/hindsight-api-slim --frozen python ../tests/ci/test_validate_fork_workflows.py
      - name: Validate candidate with trusted policy
        run: uv run --directory trusted/hindsight-api-slim --frozen python ../scripts/ci/validate_fork_workflows.py ../../candidate
